apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zready
resources:
  - k8s/namespace.yaml
  - k8s/secret.yaml
  - k8s/postgres.yaml
  - k8s/redis.yaml
  - k8s/inference.yaml
  - k8s/gateway.yaml
configMapGenerator:
  - name: zready-initdb
    files:
      - postgres/init.sql
