apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: zready-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: MODEL_NAME, value: xgb}
            - {name: INFERENCE_URL, value: "http://inference:8000"}
            - {name: REDIS_ADDR, value: "redis:6379"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: zready-db, key: DATABASE_URL}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
