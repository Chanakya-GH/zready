name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-inference.txt
      - run: pip install -r requirements-inference.txt pytest httpx
      - run: python -m pytest inference -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: test -z "$(gofmt -l gateway)"
      - run: go vet ./...
        working-directory: gateway
      - run: go test -count=1 ./...
        working-directory: gateway

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
        working-directory: native

  native-s390x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - run: docker run --rm --platform linux/s390x -v "$PWD/native":/src:ro -w /src gcc:14 make test BUILD=/tmp/b

  gateway-multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gateway.Dockerfile
          platforms: linux/amd64,linux/s390x
          push: false

  inference-s390x:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/inference.Dockerfile
          platforms: linux/s390x
          push: false
