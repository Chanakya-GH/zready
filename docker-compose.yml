services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zready
      POSTGRES_PASSWORD: zready
      POSTGRES_DB: zready
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zready"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
